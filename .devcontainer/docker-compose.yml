version: "3.8"
services:
  devcontainer:
    network_mode: host
    image: collectiveai-web
    container_name: devcontainer
    build:
      context: ../
      dockerfile: .devcontainer/Dockerfile
      target: devcontainer
    shm_size: "8gb"
    volumes:
      - ../:/workspace:cached
      - $HOME/.ssh/:/home/ubuntu/.ssh
      - $HOME/.gitconfig:/home/ubuntu/.gitconfig

    command: /bin/sh -c "while sleep 1000; do :; done"
    env_file:
      - ../.env
